name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next/
          retention-days: 1

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push --skip-generate
      - name: Start production server
        run: |
          npm run start &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Server ready"; exit 0
            fi
            sleep 1
          done
          echo "Server failed to start"; exit 1
      - name: Smoke tests
        run: |
          curl -sf -o /dev/null -w "home: %{http_code}\n" http://localhost:3000
          curl -sf -o /dev/null -w "health: %{http_code}\n" http://localhost:3000/api/health
          curl -sf -o /dev/null -w "search: %{http_code}\n" "http://localhost:3000/api/search?q=a"
          curl -sf -o /dev/null -w "flights: %{http_code}\n" http://localhost:3000/flights
      - name: Stop server
        if: always()
        run: kill $SERVER_PID 2>/dev/null || true

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=high
        continue-on-error: true

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [typecheck, lint, build, smoke-test, security-audit]
    if: always()
    steps:
      - name: Check status
        run: |
          if [[ "${{ needs.typecheck.result }}" == "success" && \
                "${{ needs.lint.result }}" == "success" && \
                "${{ needs.build.result }}" == "success" && \
                "${{ needs.smoke-test.result }}" == "success" && \
                "${{ needs.security-audit.result }}" == "success" ]]; then
            echo "All CI checks passed"; exit 0
          else
            echo "Some CI checks failed"; exit 1
          fi
